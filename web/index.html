<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java, One Concept at a Time</title>
<meta name="description" content="A daily blog revisiting Java and CS fundamentals — theory notes and worked exercises, written to be clear for beginners without being shallow for seniors.">
<meta property="og:type" content="website">
<meta property="og:title" content="Java, One Concept at a Time">
<meta property="og:description" content="A daily blog revisiting Java and CS fundamentals — theory notes and worked exercises, written to be clear for beginners without being shallow for seniors.">
<meta property="og:url" content="https://dailyjava.blog/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Java, One Concept at a Time">
<meta name="twitter:description" content="A daily blog revisiting Java and CS fundamentals — theory notes and worked exercises, written to be clear for beginners without being shallow for seniors.">
<script src="theme.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script src="tailwind.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-stone-50 text-stone-800 dark:bg-stone-950 dark:text-stone-200 min-h-screen">

<header class="border-b border-stone-200 bg-white dark:border-stone-800 dark:bg-stone-900">
  <div class="max-w-6xl mx-auto px-6 sm:px-8 py-10 flex items-start justify-between gap-4">
    <div>
      <h1 class="mt-2 text-4xl font-bold text-stone-900 dark:text-stone-50">Java, One Concept at a Time</h1>
      <p class="mt-3 text-lg text-stone-600 dark:text-stone-400 leading-relaxed max-w-2xl">
        A daily practice of revisiting Java fundamentals, solving exercises, and sharpening the basics.
      </p>
    </div>
    <button
      onclick="toggleTheme()"
      aria-label="Toggle dark mode"
      title="Toggle dark mode"
      class="shrink-0 rounded-full border border-stone-200 bg-white p-2.5 text-lg leading-none hover:border-amber-300 dark:border-stone-700 dark:bg-stone-800 dark:hover:border-amber-500"
    >
      <span class="dark:hidden">🌙</span>
      <span class="hidden dark:inline">☀️</span>
    </button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 sm:px-8 py-10">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-stone-500 dark:text-stone-500 mb-4">Days</h2>
  <ul id="days" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></ul>
</main>

<footer class="max-w-6xl mx-auto px-6 sm:px-8 py-10 border-t border-stone-200 dark:border-stone-800 text-sm text-stone-400 dark:text-stone-600">
  <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
    <span class="text-stone-500 dark:text-stone-500">Leandro Dal Bo</span>
    <span class="text-stone-300 dark:text-stone-700">·</span>
    <a class="hover:text-amber-700 dark:hover:text-amber-400" href="https://github.com/leandrodalbo" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a class="hover:text-amber-700 dark:hover:text-amber-400" href="https://www.linkedin.com/in/leandrodlb/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </div>
</footer>

<script src="days.js"></script>
<script>
  // `days` comes from days.js, generated by build.py — run that after
  // editing any day-N/*.md instead of editing this array by hand.
  const list = document.getElementById("days");

  days
    .slice()
    .sort((a, b) => b.day - a.day)
    .forEach(({ label, title, date, concepts, exercise }) => {
      const li = document.createElement("li");
      li.className = "rounded-lg border border-stone-200 bg-white dark:border-stone-800 dark:bg-stone-900 p-5 hover:border-amber-300 dark:hover:border-amber-500/60 transition-colors";
      li.innerHTML = `
        <div class="flex items-baseline justify-between gap-4">
          <span class="text-xs font-mono text-stone-400 dark:text-stone-500">${label} · ${date}</span>
        </div>
        <h3 class="mt-1 text-xl font-semibold text-stone-900 dark:text-stone-50">${title}</h3>
        <div class="mt-3 flex flex-wrap gap-x-6 gap-y-1 text-sm">
          <a class="text-amber-700 dark:text-amber-400 hover:text-amber-900 dark:hover:text-amber-300 font-medium" href="${concepts}">
            Concepts →
          </a>
          ${exercise ? `
          <a class="text-amber-700 dark:text-amber-400 hover:text-amber-900 dark:hover:text-amber-300 font-medium" href="${exercise.src}">
            Exercise: ${exercise.title} →
          </a>` : ""}
        </div>
      `;
      list.appendChild(li);
    });
</script>

</body>
</html>
